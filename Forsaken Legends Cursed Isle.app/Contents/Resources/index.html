<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forsaken Legends Cursed Isle</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: sans-serif;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .game-area {
      flex: 1;
      min-height: 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    footer {
      background: #1b1b1b;
      border-top: 1px solid #333;
      padding: 5px 10px 6px;
      font-size: 12px;
      line-height: 1.2;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .footer-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-height: 20px;
    }

    .slot {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 100%;
      justify-content: center;
    }

    .slot-name {
      width: 88px;
      background: #0f0f0f;
      color: white;
      border: 1px solid #444;
      border-radius: 5px;
      padding: 4px 6px;
      box-sizing: border-box;
      font: inherit;
      height: 26px;
    }

    .slot-save {
      width: min(520px, 62vw);
      background: #0f0f0f;
      color: white;
      border: 1px solid #444;
      border-radius: 5px;
      padding: 4px 6px;
      box-sizing: border-box;
      font: inherit;
      height: 26px;
    }

    .btn {
      background: #2d6cdf;
      color: white;
      border: 0;
      border-radius: 5px;
      padding: 0 8px;
      cursor: pointer;
      font: inherit;
      flex: 0 0 auto;
      white-space: nowrap;
      min-width: 64px;
      height: 26px;
      line-height: 26px;
    }

    .btn:hover {
      filter: brightness(1.08);
    }

    a {
      color: #8ecbff;
      text-decoration: none;
      white-space: nowrap;
    }

    a:hover {
      text-decoration: underline;
    }

    #status {
      text-align: center;
      color: #b5b5b5;
      font-size: 11px;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="game-area">
      <iframe src="game.html" title="Game"></iframe>
    </div>

    <footer>
      <div class="footer-row">
        <a href="https://sullydux.github.io/Curse/RM/" target="_blank" rel="noopener">Read Me</a>
        |
        Version <span id="versionText">2.18.62</span>
        |
        Computer, PC, &amp;
        <a href="https://sullydux.github.io/Curse/RM/#controller-support" target="_blank" rel="noopener">Controller</a>
        |
        <a href="https://sullydux.github.io/sullydux/" target="_blank" rel="noopener">Sullybase</a>
        |
        <a class="download-btn" href="https://forms.gle/juuJmwzEAf9mGriW6" target="_blank" rel="noopener">Rate the Game</a>
      </div>

      <div class="footer-row">
        <div class="slot">
          <input id="slotName1" class="slot-name" value="Save Slot 1" maxlength="24">
          <input id="saveInput1" class="slot-save" placeholder="Save 1...">
          <button class="btn" onclick="copySlot(1)">Copy</button>
        </div>
      </div>

      <div class="footer-row">
        <div class="slot">
          <input id="slotName2" class="slot-name" value="Save Slot 2" maxlength="24">
          <input id="saveInput2" class="slot-save" placeholder="Save 2...">
          <button class="btn" onclick="copySlot(2)">Copy</button>
        </div>
      </div>

      <div class="footer-row">
        <div class="slot">
          <input id="slotName3" class="slot-name" value="Save Slot 3" maxlength="24">
          <input id="saveInput3" class="slot-save" placeholder="Save 3...">
          <button class="btn" onclick="copySlot(3)">Copy</button>
        </div>
      </div>

      <div id="status">Ready.</div>
    </footer>
  </div>

  <script>
    const timers = {};

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function getSlotValue(slot) {
      return document.getElementById('saveInput' + slot).value;
    }

    function getSlotName(slot) {
      return document.getElementById('slotName' + slot).value.trim() || ('Slot ' + slot);
    }

    async function copySlot(slot) {
      const value = getSlotValue(slot);
      try {
        await navigator.clipboard.writeText(value);
        setStatus(getSlotName(slot) + ' copied.');
      } catch (e) {
        setStatus('Clipboard blocked.');
      }
    }

    function autosaveSlot(slot) {
      clearTimeout(timers[slot]);
      timers[slot] = setTimeout(async () => {
        const value = getSlotValue(slot);
        const name = getSlotName(slot);
        if (!window.pywebview?.api?.save_slot) return;
        if (!value.trim()) return;
        await window.pywebview.api.save_slot(slot, name, value);
        setStatus(name + ' auto-saved.');
      }, 400);
    }

    function bindAutosave(slot) {
      const input = document.getElementById('saveInput' + slot);
      const name = document.getElementById('slotName' + slot);
      input.addEventListener('input', () => autosaveSlot(slot));
      name.addEventListener('input', () => autosaveSlot(slot));
    }

    async function loadAllSlots() {
      if (!window.pywebview?.api?.get_all_saves) return;

      const data = await window.pywebview.api.get_all_saves();
      if (!data) return;

      if (data.Version && data.Version.value) {
        document.getElementById('versionText').textContent = data.Version.value;
      }

      for (let i = 1; i <= 3; i++) {
        const slot = data['slot' + i];
        if (slot) {
          document.getElementById('slotName' + i).value = slot.name || ('Slot ' + i);
          document.getElementById('saveInput' + i).value = slot.value || '';
        }
        bindAutosave(i);
      }

      setStatus('Loaded saved slots.');
    }

    window.addEventListener('pywebviewready', loadAllSlots);

    for (let i = 1; i <= 3; i++) {
      bindAutosave(i);
    }
  </script>
</body>
</html>
