<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Curse of the Forsaken Isle</title>
  <link rel="icon" type="image/png" href="Icon.png">
  <style>
    :root {
      --bg-1: #060708;
      --bg-2: #0f1218;
      --panel: rgba(15, 18, 24, 0.88);
      --line: #262b35;
      --text: #e9ecf1;
      --muted: #9fa8bb;
      --link: #75b7ff;
      --link-hover: #a5d1ff;
      --accent-1: #4d87ff;
      --accent-2: #6f59d9;
      --header-height: 84px;
    }

    html, body {
      height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 20% 0%, #1c2433 0%, transparent 45%),
        radial-gradient(circle at 80% 100%, #1a1b2c 0%, transparent 40%),
        linear-gradient(180deg, var(--bg-2), var(--bg-1));
      color: var(--text);
      font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    }

    body {
      min-height: 100svh;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      color: var(--link-hover);
    }

    a:focus-visible,
    .download-btn:focus-visible {
      outline: 2px solid #b8d8ff;
      outline-offset: 2px;
      border-radius: 8px;
    }

    .shell {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100svh;
    }

    header {
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
      padding: 0 12px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.05rem, 2vw, 1.4rem);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      font-weight: 700;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
    }

    .game-wrap {
      min-height: 0;
      background: #07090e;
      border-top: 1px solid #10141c;
      border-bottom: 1px solid #10141c;
    }

    .game-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
      background: var(--panel);
      border-top: 1px solid var(--line);
      padding: 10px 12px max(10px, env(safe-area-inset-bottom));
      box-sizing: border-box;
    }

    .footer-line {
      margin: 0;
      font-size: 0.86rem;
      line-height: 1.35;
      color: var(--muted);
      max-width: 1200px;
    }

    .download-btn {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 8px 20px rgba(12, 18, 36, 0.45);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .download-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    @media (max-width: 900px) {
      .footer-line {
        font-size: 0.8rem;
      }
    }

    @media (max-width: 640px) {
      header {
        height: 74px;
      }

      footer {
        gap: 7px;
        padding-top: 9px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>Curse of the Forsaken Isle</h1>
    </header>

    <section class="game-wrap" aria-label="Game container">
      <iframe
        class="game-frame"
        src="game.html"
        title="Curse of the Forsaken Isle Game"
        allowfullscreen
        sandbox="allow-forms allow-scripts allow-same-origin allow-pointer-lock allow-popups"
      >
        Your browser does not support embedded content. You can open
        <a href="game.html">game.html</a> directly.
      </iframe>
    </section>

    <footer>
      <div class="footer-line">
        <a href="https://sullydux.github.io/Curse/RM" target="_blank" rel="noopener noreferrer">Read Me</a>
        | Version 2.17.54 |
        <a href="https://forms.gle/juuJmwzEAf9mGriW6" target="_blank" rel="noopener noreferrer">Rate the Game</a>
        | Computer, PC, &
        <a href="https://sullydux.github.io/Curse/RM/#controller-support" target="_blank" rel="noopener noreferrer">Controller</a>
        |
        <a href="https://scratch.mit.edu/projects/963768137/" target="_blank" rel="noopener noreferrer">Created on Scratch</a>
      </div>
      <div class="footer-line">
        <a class="download-btn" href="game.zip" download="game.zip">Download Game</a>
      </div>
    </footer>
  </main>
</body>
</html>
