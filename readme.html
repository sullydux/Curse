<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>README.md</title>

  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 2rem;
      background: #0f1115;
      color: #e6e6e6;
    }

    main {
      max-width: 900px;
      margin: auto;
    }

    h1, h2, h3, h4, h5, h6 {
      font-weight: 700;
      margin-top: 2rem;
    }

    h1 {
      font-size: 2.4rem;
      border-bottom: 2px solid #333;
      padding-bottom: 0.3rem;
    }

    p {
      line-height: 1.7;
      margin: 1rem 0;
    }

    strong {
      font-weight: 700;
    }

    em {
      font-style: italic;
    }

    a {
      color: #6ab0ff;
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }

    code {
      background: #1c1f26;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.95em;
    }

    pre code {
      display: block;
      padding: 1rem;
      overflow-x: auto;
    }

    blockquote {
      border-left: 4px solid #444;
      padding-left: 1rem;
      color: #bdbdbd;
      margin: 1.5rem 0;
    }

    ul, ol {
      padding-left: 2rem;
    }

    hr {
      border: none;
      border-top: 1px solid #333;
      margin: 2rem 0;
    }
      img {
      max-width: 50%;
      height: auto;
      display: block;
      margin: 1.5rem auto;
    }

  </style>
</head>
<body>
  <main id="content">Loading markdown…</main>

  <script>
    // Change this to the markdown file you want to display
    const MARKDOWN_FILE = "readme.md";

    fetch(MARKDOWN_FILE)
      .then(res => {
        if (!res.ok) throw new Error("Failed to load markdown");
        return res.text();
      })
      .then(md => {
        document.getElementById("content").innerHTML = marked.parse(md);
      })
      .catch(err => {
        document.getElementById("content").innerHTML = `<p style="color:#ff6b6b">${err.message}</p>`;
      });
  </script>
</body>
</html>
